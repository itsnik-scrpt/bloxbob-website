<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101723">
  <title>BloxBob SMP</title>
  <meta name="description" content="BloxBob SMP — store and server address.">
  <link rel="preload" href="assets/bloxbob-logo.png" as="image">
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body class="home-page">
  <main class="home" aria-label="BloxBob SMP">
    <img class="home-logo" src="assets/bloxbob-logo.png" alt="BloxBob SMP">
    <div class="home-actions">
      <a class="home-button store-button" href="ranks.html">
        <img src="assets/store-chest.png" alt="" width="40" height="40">
        <span>Store</span>
      </a>
      <button class="home-button join-button" type="button" data-copy-ip="bloxbob.net" aria-label="Join BloxBob SMP: copy bloxbob.net">
        <span class="join-symbol" aria-hidden="true">✦</span>
        <span data-copy-label>Join</span>
      </button>
    </div>
  </main>
  <div class="copy-toast" role="status" aria-live="polite" data-toast></div>
</body>
</html>
